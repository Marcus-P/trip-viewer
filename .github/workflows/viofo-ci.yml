name: VIOFO feature CI

on:
  push:
    branches: ['feature/viofo-a229-pro']
  workflow_dispatch:

jobs:
  rust-test:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            file \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
      - name: Format VIOFO GPS files
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git add \
            src-tauri/src/gps/mod.rs \
            src-tauri/src/gps/validation.rs \
            src-tauri/src/gps/viofo.rs \
            src-tauri/src/gps/viofo_timing.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Format VIOFO GPS changes'
            git push
          fi
          git restore src-tauri
      - name: Rust format check for VIOFO GPS changes
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --exit-code -- \
            src-tauri/src/gps/mod.rs \
            src-tauri/src/gps/validation.rs \
            src-tauri/src/gps/viofo.rs \
            src-tauri/src/gps/viofo_timing.rs
      - name: Compile and run GPS tests
        run: 'cargo test --manifest-path src-tauri/Cargo.toml gps::'
