name: Parking diagnostic Windows smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Prepare tiny synthetic recordings and run the actual portable launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIAG_WORK = Join-Path $env:RUNNER_TEMP 'parking-observations'
          New-Item -ItemType Directory -Path $env:DIAG_WORK | Out-Null
          @'
          import importlib.util,os
          from pathlib import Path
          root=Path(os.environ['DIAG_WORK'])
          source=Path('test-package/test_viofo_time_diagnostic.py').resolve()
          spec=importlib.util.spec_from_file_location('fixture',source)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          for name in ['two channels','three channels']:
              folder=root/name;folder.mkdir()
              (folder/'2020_0101_000000_001PF.MP4').write_bytes(module.fixture(count=3))
          '@ | python
          & .\test-package\parking-diagnostic\run-windows.ps1 `
            -TwoChannel (Join-Path $env:DIAG_WORK 'two channels') `
            -ThreeChannel (Join-Path $env:DIAG_WORK 'three channels') `
            -ToolDir (Resolve-Path .\test-package\parking-diagnostic).Path `
            -ReportPath (Join-Path $env:DIAG_WORK 'report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher failed' }
          $report = Get-Content -Raw (Join-Path $env:DIAG_WORK 'report.json') | ConvertFrom-Json
          if ($report.format -ne 'viofo-parking-observations-v3') { throw 'Wrong report format' }
          if ($report.sets.Count -ne 2) { throw 'Missing recording set' }
          foreach ($set in $report.sets) {
            if ($set.files[0].gps.selected_record_times.records -ne 3) { throw 'Wrong record count' }
          }
          $text = Get-Content -Raw (Join-Path $env:DIAG_WORK 'report.json')
          if ($text.Contains($env:DIAG_WORK) -or $text.Contains('2020_0101')) { throw 'Report leaked input identity' }
