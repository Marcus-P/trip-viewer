name: Desktop Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan immutable release for this main commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Validate version and mandatory release notes
        run: node scripts/check-version.mjs
      - name: Select stable version or commit-specific main build
        id: plan
        run: node scripts/plan-release.mjs
  desktop:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-packages.yml
  release:
    name: Ubuntu packages and durable publication for all three platforms
    needs: [prepare, desktop]
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf \
            gstreamer1.0-libav gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - run: npm ci
      # Protected PR CI already ran relevant unit tests/audit. Build the actual
      # merged release once; version-only docs releases need packaging, not a
      # second debug build and repetition of the same unit tests.
      - name: Prepare application and dependency notices
        run: python3 scripts/prepare-release-licenses.py
      - name: Build Ubuntu packages
        shell: bash
        run: |
          set -euo pipefail
          NO_STRIP=true npm run tauri -- build --bundles appimage,deb
          SOURCE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          python3 scripts/prepare-ubuntu-deb.py "$DEB"
          cp "$SOURCE" "release-assets/Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.AppImage"
          cp "$DEB" "release-assets/Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.deb"
          chmod +x "release-assets/Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.AppImage"
          cp scripts/install-trip-viewer-ubuntu.sh release-assets/
      - name: Validate release packages
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$PWD/release-assets/Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.AppImage"
          DEB="$PWD/release-assets/Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.deb"
          python3 scripts/validate-ubuntu-deb.py "$DEB"
          TEST_HOME="${RUNNER_TEMP}/trip-viewer-home"
          mkdir -p "$TEST_HOME"
          TRIPVIEWER_INSTALL_ROOT="$TEST_HOME" bash scripts/install-trip-viewer-ubuntu.sh "$APPIMAGE"
          test -x "$TEST_HOME/.local/opt/trip-viewer/Trip.Viewer.AppImage"
          test -s "$TEST_HOME/.local/share/applications/com.tripviewer.app.desktop"
          test -s "$TEST_HOME/.local/share/icons/hicolor/256x256/apps/trip-viewer.png"
      - name: Download small native installers for the same merged tree
        uses: actions/download-artifact@v5
        with:
          pattern: release-desktop-*-${{ github.sha }}
          merge-multiple: true
          path: release-assets/
      - name: Validate transferred installer checksums
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS-Windows-x64.txt
          sha256sum -c SHA256SUMS-macOS-universal.txt
          rm SHA256SUMS-Windows-x64.txt SHA256SUMS-macOS-universal.txt
      - name: Create checksums and AppImage bundle
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          tar -czf "Trip.Viewer_${VERSION}_Ubuntu-24.04_bundle.tar.gz" \
            "Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.AppImage" \
            install-trip-viewer-ubuntu.sh LICENSE THIRD_PARTY_NOTICES.md \
            NODE_RUNTIME_LICENSES.txt RUST_DEPENDENCY_LICENSES.txt \
            NODE_RUNTIME_LICENSE_TEXTS.tar.gz RUST_DEPENDENCY_LICENSE_TEXTS.tar.gz
          sha256sum \
            "Trip.Viewer_${VERSION}_Windows_x64_setup.exe" \
            "Trip.Viewer_${VERSION}_macOS_universal_experimental.dmg" \
            "Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.AppImage" \
            "Trip.Viewer_${VERSION}_Ubuntu-24.04_amd64.deb" \
            "Trip.Viewer_${VERSION}_Ubuntu-24.04_bundle.tar.gz" > SHA256SUMS.txt
      - name: Create durable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/release-notes.md"
          import os, pathlib, re, urllib.parse
          text = pathlib.Path("RELEASE_NOTES.md").read_text()
          if os.environ["RELEASE_PRERELEASE"] == "true":
              print("Main branch build. The application version is unchanged; automatic update hints continue to use stable releases only.\n")
          print("Source commit: https://github.com/Marcus-P/trip-viewer/commit/" + os.environ["GITHUB_SHA"] + "\n")
          base = "https://github.com/Marcus-P/trip-viewer/blob/" + os.environ["GITHUB_SHA"] + "/"
          text = re.sub(r"\]\((?!https?://|mailto:|#)([^)]+)\)",
                        lambda m: "](" + base + urllib.parse.quote(m[1], safe="/#") + ")", text)
          print(text)
          PY
          RELEASE_OPTIONS=()
          RELEASE_TITLE="Trip Viewer v${VERSION} — Windows, Ubuntu and experimental macOS"
          if [ "$RELEASE_PRERELEASE" = true ]; then
            RELEASE_OPTIONS+=(--prerelease --latest=false)
            RELEASE_TITLE="Trip Viewer main ${GITHUB_SHA:0:12} (app ${VERSION}) — Windows, Ubuntu and experimental macOS"
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" "${RELEASE_OPTIONS[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" release-assets/*
      - name: Remove temporary native transfer artifacts after publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("release-desktop-")) | .id' \
            > "${RUNNER_TEMP}/transfer-artifact-ids"
          while read -r ARTIFACT_ID; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
              || echo "::warning::Temporary artifact cleanup failed; one-day retention still applies."
          done < "${RUNNER_TEMP}/transfer-artifact-ids"
