name: Publish VIOFO comparison diagnostic

on:
  push:
    branches: [test/alinnastac-viofo-a229]
    paths:
      - tools/viofo-compat/**
      - .github/workflows/viofo-comparison-download.yml

permissions:
  contents: write

jobs:
  comparison-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build only the small headless worker
        working-directory: tools/viofo-compat
        run: cargo build --locked --release
      - name: Package worker, runner and license texts
        run: python3 tools/viofo-compat/package.py
      - name: Publish an isolated test download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create test-viofo-focus-20261124 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'VIOFO focused GPS investigation — Ubuntu test' \
            --notes 'Read-only focused GPS investigation. Includes original PR12 decoder and fresh replay of the 0.13.0 channel-selection, cross-file boundary and stitching rules. Locates the maximum jump, compares all channels and reports removed points. No app installation, media changes, archive writes or uploads. Exact coordinates excluded by default. Python 3 required on Ubuntu 24.04 x64. This is a diagnostic prerelease; stable v0.13.0 and earlier test downloads remain unchanged. Focused real-camera report pending.' \
            tools/viofo-compat/package/*.tar.gz \
            tools/viofo-compat/package/SHA256SUMS-viofo-focus.txt
