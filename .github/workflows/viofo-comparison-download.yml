name: Publish VIOFO comparison diagnostic

on:
  push:
    branches: [test/alinnastac-viofo-a229]
    paths:
      - tools/viofo-compat/**
      - .github/workflows/viofo-comparison-download.yml

permissions:
  contents: write

jobs:
  comparison-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build only the small headless worker
        working-directory: tools/viofo-compat
        run: cargo build --locked --release
      - name: Package worker, runner and license texts
        run: python3 tools/viofo-compat/package.py
      - name: Publish an isolated test download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create test-viofo-compat-20261124 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'VIOFO compatibility diagnostic — Ubuntu test' \
            --notes 'Read-only comparison of @alinnastac PR12 (919abfd) and isolated PR21 (eb0a5a3). This is a diagnostic CLI, not an application update. Stable v0.13.0 remains unchanged. Extract the bundle and follow README.md. Python 3 required. No media upload or archive writes. Actual A229 media validation is pending.' \
            tools/viofo-compat/package/*.tar.gz \
            tools/viofo-compat/package/SHA256SUMS-viofo-compare.txt
