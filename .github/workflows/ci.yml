name: CI

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf \
            gstreamer1.0-libav gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend typecheck/build
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Ubuntu AppImage
        run: NO_STRIP=true npm run tauri -- build --bundles appimage
