name: Isolated Ubuntu acceptance download
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-ubuntu-014-download
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 48f52e7c230a94250bc1a29973d77c39894d13c7
      RELEASE_TAG: test-0.14.0-48f52e7-ubuntu
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 48f52e7c230a94250bc1a29973d77c39894d13c7
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify upstream and stamp unique acceptance version
        run: |
          node scripts/check-upstream.mjs
          node scripts/preview-version.mjs
          node scripts/check-version.mjs
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm ci
      - name: Preserve bundled license notices
        run: python3 scripts/prepare-release-licenses.py
      - name: Build only the isolated Ubuntu AppImage
        env:
          CARGO_BUILD_JOBS: '2'
          NO_STRIP: 'true'
        run: npm run tauri -- build --bundles appimage --config src-tauri/tauri.evidence-test.conf.json
      - name: Prepare checked download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          mapfile -t images < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          test "${#images[@]}" = 1
          cp "${images[0]}" download/TripViewer-0.14-Test-Ubuntu-x86_64.AppImage
          VERSION="$(node -p "require('./package.json').version")"
          printf 'Trip Viewer isolated Ubuntu acceptance\nVersion: %s\nSource: %s\nRun: %s/%s/actions/runs/%s\nIdentifier: com.tripviewer.evidencetest\nShared archive schema: 13\n' "$VERSION" "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > download/BUILD_INFO.txt
          cd download
          sha256sum TripViewer-0.14-Test-Ubuntu-x86_64.AppImage > SHA256SUMS.txt
      - name: Publish isolated prerelease, never Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/acceptance-notes.md" <<'EOF'
          Isolated Ubuntu 24.04 x86_64 acceptance package for the proposed develop integration. Source commit: 48f52e7c230a94250bc1a29973d77c39894d13c7.

          This is a test-branch download, not a merge into develop/main or a stable app update. Separate Evidence Test identity/settings and no updater endpoints. Close other Trip Viewer instances and use a disposable test archive for initial acceptance; selecting a shared archive is not isolated by the application identity.

          Includes schema-13 compatibility with retained archive-local extras and backups for verified legacy fork schemas; central immediate settings; camera-independent GPS preview indexing and metadata-ready direct positioning. Keep archive-extras-v1.sqlite because it contains bookmarks. Shared-schema compatibility does not imply old applications understand fork-only features.

          The source passed 418 Rust tests (3 opt-in ignored), 142 frontend tests and local Ubuntu packaging. This run builds only Ubuntu and does not repeat those suites. Real-camera acceptance is pending. Implementation and preparation were assisted by Codex; contributor authorship and bundled license notices are preserved.

          Download AppImage and SHA256SUMS.txt together. Verify with sha256sum -c SHA256SUMS.txt. Run the AppImage after making it executable, or extract it with --appimage-extract and start squashfs-root/AppRun. No installation or sudo is needed.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title '0.14 isolated Ubuntu acceptance — 48f52e7' --prerelease --latest=false --notes-file "$RUNNER_TEMP/acceptance-notes.md" download/TripViewer-0.14-Test-Ubuntu-x86_64.AppImage download/SHA256SUMS.txt download/BUILD_INFO.txt
