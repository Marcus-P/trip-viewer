name: PR21 isolated Ubuntu acceptance download
on:
  workflow_dispatch:
    inputs:
      diagnose_run:
        description: Read one existing failed run without rebuilding
        type: string
        default: ''
      parking_windows:
        description: Test only the portable parking diagnostic on Windows (no app build)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  inspect-existing-run:
    if: inputs.diagnose_run != '' && inputs.parking_windows != true
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Report the existing failure through check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TO_INSPECT: ${{ inputs.diagnose_run }}
        run: |
          gh run view "$RUN_TO_INSPECT" --repo "$GITHUB_REPOSITORY" --log-failed > failure.txt
          python3 - <<'PYREPORT'
          from pathlib import Path
          text=Path("failure.txt").read_text()[-18000:]
          escaped=text.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print("::warning title=Existing package failure::"+escaped)
          PYREPORT
  ubuntu-test:
    if: inputs.diagnose_run == '' && inputs.parking_windows != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pr21-ubuntu-acceptance
          save-if: 'true'
          cache-on-failure: true
      - name: Install Ubuntu native packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf gstreamer1.0-libav gstreamer1.0-gl gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly xvfb xauth dbus-x11
      - run: npm ci --no-audit --no-fund
      - name: Build only the isolated acceptance AppImage
        env:
          NO_STRIP: 'true'
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles appimage --config test-package/tauri.test.conf.json -- --locked
      - name: Package with separate launcher and verify startup
        run: python3 test-package/package.py
      - name: Keep the checked package for upload-only recovery
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pr21-ubuntu-17f6f97-${{ github.run_id }}
          path: |
            test-package/out/*-Ubuntu-x86_64.tar.gz
            test-package/out/TEST-PACKAGE-SHA256SUMS.txt
            test-package/tauri.test.conf.json
            test-package/PR21-description.md
            test-package/PR21-A129-test-request.md
          retention-days: 1
      - name: Upload and publish only the test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 test-package/publish.py

  windows-diagnostic:
    if: inputs.parking_windows == true
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Prepare tiny synthetic recordings and run the actual portable launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIAG_WORK = Join-Path $env:RUNNER_TEMP 'parking-observations'
          New-Item -ItemType Directory -Path $env:DIAG_WORK | Out-Null
          @'
          import importlib.util,os
          from pathlib import Path
          root=Path(os.environ['DIAG_WORK'])
          source=Path('test-package/test_viofo_time_diagnostic.py').resolve()
          spec=importlib.util.spec_from_file_location('fixture',source)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          for name in ['two channels','three channels']:
              folder=root/name;folder.mkdir()
              (folder/'2020_0101_000000_001PF.MP4').write_bytes(module.fixture(count=3))
          '@ | python
          & .\test-package\parking-diagnostic\run-windows.ps1 `
            -TwoChannel (Join-Path $env:DIAG_WORK 'two channels') `
            -ThreeChannel (Join-Path $env:DIAG_WORK 'three channels') `
            -ToolDir (Resolve-Path .\test-package\parking-diagnostic).Path `
            -ReportPath (Join-Path $env:DIAG_WORK 'report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher failed' }
          $report = Get-Content -Raw (Join-Path $env:DIAG_WORK 'report.json') | ConvertFrom-Json
          if ($report.format -ne 'viofo-parking-observations-v3') { throw 'Wrong report format' }
          if ($report.sets.Count -ne 2) { throw 'Missing recording set' }
          foreach ($set in $report.sets) {
            if ($set.files[0].gps.selected_record_times.records -ne 3) { throw 'Wrong record count' }
          }
          $text = Get-Content -Raw (Join-Path $env:DIAG_WORK 'report.json')
          if ($text.Contains($env:DIAG_WORK) -or $text.Contains('2020_0101')) { throw 'Report leaked input identity' }
