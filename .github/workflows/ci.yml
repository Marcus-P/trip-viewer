name: PR21 isolated Ubuntu acceptance download
on:
  workflow_dispatch:
    inputs:
      diagnose_run:
        description: Read one existing failed run without rebuilding
        type: string
        default: ''
permissions:
  contents: write
jobs:
  inspect-existing-run:
    if: inputs.diagnose_run != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Report the existing failure through check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TO_INSPECT: ${{ inputs.diagnose_run }}
        run: |
          gh run view "$RUN_TO_INSPECT" --repo "$GITHUB_REPOSITORY" --log-failed > failure.txt
          python3 - <<'PYREPORT'
          from pathlib import Path
          text=Path("failure.txt").read_text()[-18000:]
          escaped=text.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print("::warning title=Existing package failure::"+escaped)
          PYREPORT
  ubuntu-test:
    if: inputs.diagnose_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: pr21-ubuntu-acceptance
          save-if: 'true'
          cache-on-failure: true
      - name: Install Ubuntu native packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf gstreamer1.0-libav gstreamer1.0-gl gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly xvfb xauth dbus-x11
      - run: npm ci --no-audit --no-fund
      - name: Build only the isolated acceptance AppImage
        env:
          NO_STRIP: 'true'
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles appimage --config test-package/tauri.test.conf.json -- --locked
      - name: Package with separate launcher and verify startup
        run: python3 test-package/package.py
      - name: Keep the checked package for upload-only recovery
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pr21-ubuntu-17f6f97-${{ github.run_id }}
          path: |
            test-package/out/*-Ubuntu-x86_64.tar.gz
            test-package/out/TEST-PACKAGE-SHA256SUMS.txt
            test-package/tauri.test.conf.json
            test-package/PR21-description.md
            test-package/PR21-A129-test-request.md
          retention-days: 1
      - name: Upload and publish only the test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 test-package/publish.py
